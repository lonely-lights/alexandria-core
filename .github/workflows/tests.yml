name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # composer:2.8+ is required for GitHub's JWT-format installation tokens
          # (the shorthand `composer:v2` can resolve to an older 2.x that rejects
          # the dots in JWT tokens — fails with "contains invalid characters").
          tools: composer:2.8
          coverage: xdebug

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Tests
        run: vendor/bin/pest
